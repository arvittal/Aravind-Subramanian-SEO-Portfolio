    <text x="32" y="24" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF">Total impressions</text>
    <text x="12" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#FFFFFF">11.4k</text>
    <!-- Help Icon -->
    <circle cx="130" cy="58" r="6" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" fill="none"/>
    <text x="130" y="61.5" font-family="Roboto, sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8" text-anchor="middle">?</text>
  </g>

  <!-- Card 3: Average CTR (Inactive) -->
  <g transform="translate(298, 12)">
    <rect width="138" height="74" rx="4" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
    <!-- Checkbox unchecked -->
    <rect x="12" y="12" width="15" height="15" rx="2" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.8"/>
