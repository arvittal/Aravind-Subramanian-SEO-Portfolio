<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%" fill="none">
  <!-- Clean Canvas Background -->
  <rect width="1100" height="360" rx="8" fill="#FFFFFF"/>

  <!-- Top Metric Cards Grid -->
  <!-- Card 1: Total Clicks (Active - Blue) -->
  <g transform="translate(16, 12)">
    <rect width="138" height="74" rx="4" fill="#1A73E8"/>
    <!-- Checkbox checked -->
    <rect x="12" y="12" width="15" height="15" rx="2" fill="#1A73E8" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M15 19.5 L18 22.5 L24 15.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="24" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF">Total clicks</text>
    <text x="12" y="58" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#FFFFFF">896</text>
    <!-- Help Icon -->
    <circle cx="124" cy="58" r="6" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" fill="none"/>
    <text x="124" y="61.5" font-family="Roboto, sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8" text-anchor="middle">?</text>
  </g>

  <!-- Card 2: Total Impressions (Active - Purple) -->
